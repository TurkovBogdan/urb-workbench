[project]
name = "urb_workbench"
version = "0.7.0"
requires-python = ">=3.12"
# Прямых зависимостей ровно столько, сколько импортирует код. Четыре из них импорта не имеют
# и всё равно обязательны: `asyncpg` и `aiosqlite` — драйверы, которые SQLAlchemy поднимает по
# имени из DSN; `python-dotenv` читает `.env` под pydantic-settings; `uvicorn` запускается как
# сервер. Остальное, что везла эта сборка (парсеры HTML и офисных файлов, клиенты Gmail и
# Intercom, хэши паролей), уехало вместе с модулями донора 2026-09-20.
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "croniter>=2.0",
    "python-ulid>=3.1.0",
    "fastmcp>=3.4,<4",
    "psutil>=6.0",
    "watchfiles>=0.24",
]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-xdist>=3.0",
    "pytest-cov>=6,<7",
]
build = [
    "pyinstaller>=6.0",
]

[tool.urb_workbench]
# Дата выпуска, который назван в `[project] version`. Ставится тем же коммитом, что и номер;
# показывается на странице «О приложении». Стандартного поля под неё в pyproject нет.
release_date = "2026-09-21"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "pure: без БД и сети; гоняются по умолчанию",
    "db: требует БД (in-memory SQLite, схема из ОРМ-моделей); гоняется по умолчанию",
    "heavy: реальные Alembic-миграции — только Postgres (TEST_PG_DSN), иначе скип; ключ --heavy",
    "live: тесты с реальными внешними запросами (требуют токен/сеть); отдельным ключом --live",
]
addopts = "-m 'not heavy and not live'"
